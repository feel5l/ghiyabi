[build]
  # Monorepo root: install all workspaces, then build the Vite app only.
  command = "pnpm install --frozen-lockfile && pnpm --filter @workspace/ghiyabi run build"
  publish = "artifacts/ghiyabi/dist/public"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
